spring:
  application:
    name: orderflow
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

orderflow:
  jwt:
    secret: ${ORDERFLOW_JWT_SECRET:}
    issuer: orderflow
    access-token-ttl: PT30M
  admin:
    email: ${ORDERFLOW_ADMIN_EMAIL:}
    password: ${ORDERFLOW_ADMIN_PASSWORD:}

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(--- %esb(){APPLICATION_NAME}[%15.15t] %esb(%X{requestId})){faint}%clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %kvp{NONE}%n%wEx"

management:
  endpoints:
    web:
      exposure:
        include: health
