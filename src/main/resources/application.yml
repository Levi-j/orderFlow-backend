spring:
  application:
    name: orderflow
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

orderflow:
  jwt:
    secret: ${ORDERFLOW_JWT_SECRET:}
    issuer: orderflow
    access-token-ttl: PT30M
  admin:
    email: ${ORDERFLOW_ADMIN_EMAIL:}
    password: ${ORDERFLOW_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
